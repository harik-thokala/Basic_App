version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: url_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # ADD THIS HEALTHCHECK
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: url_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: url_app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/url_shortener_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
    # UPDATE DEPENDS_ON to wait for the healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data: